<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlchemyPay On-Ramp Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      background: #1a1d2e;
      border-bottom: 1px solid #2d3748;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    header h1 { font-size: 18px; font-weight: 600; }
    header .badge {
      background: #f59e0b22;
      color: #f59e0b;
      border: 1px solid #f59e0b44;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .layout {
      display: flex;
      gap: 0;
      height: calc(100vh - 61px);
    }

    /* ── 左侧配置面板 ── */
    .config-panel {
      width: 380px;
      min-width: 320px;
      background: #1a1d2e;
      border-right: 1px solid #2d3748;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 12px;
    }

    .field { margin-bottom: 14px; }
    .field label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .field label .required { color: #f87171; font-size: 11px; }
    .field label .tip {
      color: #64748b;
      font-size: 11px;
      font-weight: 400;
    }

    .field input, .field select {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2d3748;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 13px;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus, .field select:focus {
      border-color: #6366f1;
    }
    .field input::placeholder { color: #475569; }
    .field select option { background: #1a1d2e; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .env-toggle {
      display: flex;
      background: #0f1117;
      border: 1px solid #2d3748;
      border-radius: 8px;
      overflow: hidden;
    }
    .env-toggle button {
      flex: 1;
      padding: 8px;
      font-size: 13px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      background: transparent;
      color: #64748b;
      transition: all 0.15s;
    }
    .env-toggle button.active {
      background: #6366f1;
      color: #fff;
    }

    .btn-launch {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-launch:hover { opacity: 0.9; }
    .btn-launch:active { transform: scale(0.98); }

    .url-preview {
      background: #0f1117;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 11px;
      color: #64748b;
      word-break: break-all;
      line-height: 1.6;
      max-height: 80px;
      overflow-y: auto;
    }
    .url-preview .hl { color: #818cf8; }

    /* ── 右侧 iframe 区域 ── */
    .iframe-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f1117;
      padding: 24px;
      gap: 16px;
    }

    .iframe-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 500px;
      max-width: 100%;
    }
    .iframe-toolbar .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #334155;
    }
    .iframe-toolbar .status-dot.active {
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e88;
    }
    .iframe-toolbar .status-text {
      font-size: 12px;
      color: #64748b;
    }
    .iframe-toolbar .open-new {
      margin-left: auto;
      font-size: 12px;
      color: #818cf8;
      text-decoration: none;
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 4px 8px;
    }
    .iframe-toolbar .open-new:hover { text-decoration: underline; }

    .iframe-wrapper {
      width: 500px;
      max-width: 100%;
      height: 625px;
      background: #1a1d2e;
      border: 1px solid #2d3748;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
    }

    .iframe-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #475569;
    }
    .iframe-placeholder .icon { font-size: 48px; }
    .iframe-placeholder p { font-size: 14px; }
    .iframe-placeholder small { font-size: 12px; color: #334155; }

    iframe#ramp-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    /* 消息日志 */
    .log-panel {
      width: 500px;
      max-width: 100%;
      background: #1a1d2e;
      border: 1px solid #2d3748;
      border-radius: 10px;
      padding: 12px;
      max-height: 120px;
      overflow-y: auto;
    }
    .log-header {
      font-size: 11px;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .log-entry {
      font-size: 11px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: #94a3b8;
      padding: 2px 0;
      border-bottom: 1px solid #1e2337;
    }
    .log-entry.success { color: #4ade80; }
    .log-entry.error   { color: #f87171; }
    .log-entry.info    { color: #818cf8; }

    .divider {
      height: 1px;
      background: #2d3748;
      margin: 4px 0;
    }

    .note-box {
      background: #f59e0b11;
      border: 1px solid #f59e0b33;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: #fbbf24;
      line-height: 1.6;
    }
    .note-box strong { display: block; margin-bottom: 4px; }
  </style>
</head>
<body>

<header>
  <div class="logo">⚡</div>
  <h1>AlchemyPay On-Ramp</h1>
  <span class="badge">DEMO</span>
</header>

<div class="layout">

  <!-- ── 配置面板 ── -->
  <div class="config-panel">

    <div>
      <div class="section-title">环境</div>
      <div class="env-toggle">
        <button class="active" onclick="setEnv('test', this)">🧪 Sandbox</button>
        <button onclick="setEnv('prod', this)">🚀 Production</button>
      </div>
    </div>

    <div>
      <div class="section-title">必填参数</div>

      <div class="field">
        <label>AppID <span class="required">*</span></label>
        <input id="appId" type="text" placeholder="从 AlchemyPay 后台获取" />
      </div>

      <div class="field">
        <label>AppSecret <span class="required">*</span>
          <span class="tip">（用于生成签名，不会离开本页面）</span>
        </label>
        <input id="appSecret" type="password" placeholder="从 AlchemyPay 后台获取" />
      </div>

      <div class="field">
        <label>收款钱包地址 <span class="required">*</span>
          <span class="tip">（接收加密货币的地址）</span>
        </label>
        <input id="address" type="text" placeholder="0x..." />
      </div>
    </div>

    <div>
      <div class="section-title">交易参数</div>

      <div class="row-2">
        <div class="field">
          <label>加密货币</label>
          <select id="crypto">
            <option value="USDT">USDT</option>
            <option value="USDC">USDC</option>
            <option value="ETH">ETH</option>
            <option value="BNB">BNB</option>
            <option value="BTC">BTC</option>
          </select>
        </div>
        <div class="field">
          <label>网络</label>
          <select id="network">
            <option value="BSC">BSC（推荐测试）</option>
            <option value="ETH">Ethereum</option>
            <option value="MATIC">Polygon</option>
            <option value="ARBITRUM">Arbitrum</option>
            <option value="TRC20">TRC20</option>
          </select>
        </div>
      </div>

      <div class="row-2">
        <div class="field">
          <label>法币</label>
          <select id="fiat">
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
            <option value="HKD">HKD</option>
            <option value="SGD">SGD</option>
          </select>
        </div>
        <div class="field">
          <label>金额 <span class="tip">（建议 ≤$20）</span></label>
          <input id="fiatAmount" type="number" placeholder="如: 15" value="15" />
        </div>
      </div>
    </div>

    <div>
      <div class="section-title">可选参数</div>

      <div class="field">
        <label>用户邮箱 <span class="tip">（预填，免再次输入）</span></label>
        <input id="email" type="email" placeholder="user@example.com" />
      </div>

      <div class="field">
        <label>订单号 <span class="tip">（merchantOrderNo，建议填写）</span></label>
        <input id="merchantOrderNo" type="text" placeholder="自动生成" />
      </div>

      <div class="field">
        <label>回调地址 <span class="tip">（redirectUrl）</span></label>
        <input id="redirectUrl" type="text" placeholder="https://your-site.com/callback" />
      </div>
    </div>

    <div>
      <div class="section-title">签名调试</div>
      <div class="url-preview" id="signDebug" style="margin-bottom:8px;font-size:10.5px;min-height:48px;">填写 AppID + AppSecret 后自动显示签名内容…</div>
      <div class="section-title" style="margin-top:10px;">最终 URL 预览</div>
      <div class="url-preview" id="urlPreview">填写 AppID 后自动生成 URL…</div>
    </div>

    <div class="note-box">
      <strong>⚠️ 测试注意</strong>
      Sandbox 为真实交易，建议金额 ≤ $20。
      测试前需向 ACH 申请白名单（邮件），推荐 USDT/BSC 开始测试。
    </div>

    <button class="btn-launch" onclick="launchIframe()">🚀 加载 iframe</button>

  </div>

  <!-- ── iframe 展示区 ── -->
  <div class="iframe-panel">

    <div class="iframe-toolbar">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">等待加载…</span>
      <button class="open-new" onclick="openNewTab()">↗ 新窗口打开</button>
    </div>

    <div class="iframe-wrapper">
      <div class="iframe-placeholder" id="placeholder">
        <div class="icon">💳</div>
        <p>填写左侧参数后点击「加载 iframe」</p>
        <small>iframe 尺寸：500 × 625 px（官方推荐）</small>
      </div>
      <iframe
        id="ramp-frame"
        title="AlchemyPay On-Ramp Widget"
        allowtransparency="true"
        allowfullscreen
        allow="payment"
      ></iframe>
    </div>

    <div class="log-panel">
      <div class="log-header">📋 事件日志 (postMessage)</div>
      <div id="logContainer">
        <div class="log-entry">等待 iframe 加载…</div>
      </div>
    </div>

  </div>
</div>

<script>
  let currentEnv = 'test';
  let currentUrl = '';

  const DOMAINS = {
    test: 'https://ramptest.alchemypay.org',
    prod: 'https://ramp.alchemypay.org',
  };

  // ──────────────────────────────────────────
  // AlchemyPay 签名逻辑（严格对齐官方 Node.js 版本）
  // ──────────────────────────────────────────

  /**
   * 步骤1: 按 key ASCII 升序排序，拼接 key=value&key=value...
   * ⚠️  value 不做任何 encode，使用原始值（与官方一致）
   * 空值、数组跳过
   */
  function getStringToSign(params) {
    return Object.keys(params)
      .sort()
      .map(key => {
        const v = params[key];
        if (Array.isArray(v) || v === '' || v === null || v === undefined) return null;
        return `${key}=${v}`;
      })
      .filter(Boolean)
      .join('&');
  }

  /**
   * 步骤2: HMAC-SHA256，输出 base64，最后 encodeURIComponent
   * signContent = timestamp + 'GET' + '/index/rampPageBuy?' + rawQuery
   */
  async function generateSignature(timestamp, httpMethod, requestPath, secretKey) {
    const signContent = timestamp + httpMethod + requestPath;
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey(
      'raw', enc.encode(secretKey),
      { name: 'HMAC', hash: 'SHA-256' },
      false, ['sign']
    );
    const sigBuffer = await crypto.subtle.sign('HMAC', key, enc.encode(signContent));
    const sigBase64 = btoa(String.fromCharCode(...new Uint8Array(sigBuffer)));
    return { signContent, signatureRaw: sigBase64, signature: encodeURIComponent(sigBase64) };
  }

  // ──────────────────────────────────────────
  // 初始化
  // ──────────────────────────────────────────
  document.getElementById('merchantOrderNo').placeholder = 'ORD-' + Date.now();

  function setEnv(env, btn) {
    currentEnv = env;
    document.querySelectorAll('.env-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    updateUrlPreview();
  }

  ['appId','appSecret','address','crypto','network','fiat','fiatAmount','email','merchantOrderNo','redirectUrl']
    .forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('input', updateUrlPreview);
      if (el.tagName === 'SELECT') el.addEventListener('change', updateUrlPreview);
    });

  /**
   * 收集参数 → 生成 rawQuery（签名用）→ 生成带 sign 的最终 URL
   *
   * 关键区分：
   *   rawQuery    = key=原始value&...   （用于签名，不 encode value）
   *   finalQuery  = key=encodedValue&... （用于 URL，需 encode 特殊字符）
   *   sign 追加在 finalQuery 末尾
   */
  async function buildSignedUrl() {
    const appId     = document.getElementById('appId').value.trim();
    const appSecret = document.getElementById('appSecret').value.trim();
    if (!appId) return null;

    const timestamp = '1772460961061';

    // 收集参与签名的参数（原始值，不 encode）
    const sigParams = { appId, timestamp };

    sigParams.crypto  = document.getElementById('crypto').value;
    sigParams.network = document.getElementById('network').value;
    sigParams.fiat    = document.getElementById('fiat').value;

    const fiatAmount = document.getElementById('fiatAmount').value.trim();
    if (fiatAmount) sigParams.fiatAmount = fiatAmount;

    const orderNo = document.getElementById('merchantOrderNo').value.trim() || ('ORD-' + timestamp);
    sigParams.merchantOrderNo = orderNo;

    const address = document.getElementById('address').value.trim();
    if (address) sigParams.address = address;

    const email = document.getElementById('email').value.trim();
    if (email) sigParams.email = email;

    const redirectUrl = document.getElementById('redirectUrl').value.trim();
    if (redirectUrl) sigParams.redirectUrl = redirectUrl;

    // ① 签名用：原始 value，不 encode
    const rawQuery    = getStringToSign(sigParams);
    const requestPath = '/index/rampPageBuy?' + rawQuery;

    // ② URL 用：value 做 encodeURIComponent，保证特殊字符安全
    const finalQuery = Object.keys(sigParams)
      .sort()
      .filter(k => sigParams[k] !== '' && sigParams[k] != null)
      .map(k => `${k}=${encodeURIComponent(sigParams[k])}`)
      .join('&');

    let signatureStr = '';
    let signContent  = '';
    let signatureRaw = '';

    if (appSecret) {
      const result = await generateSignature(timestamp, 'GET', requestPath, appSecret);
      signatureStr = result.signature;      // encodeURIComponent(base64)
      signatureRaw = result.signatureRaw;   // 原始 base64，用于调试
      signContent  = result.signContent;
    }

    // 最终 URL = base?finalQuery&sign=encodedBase64
    const url = `${DOMAINS[currentEnv]}?${finalQuery}${signatureStr ? '&sign=' + signatureStr : ''}`;

    return { url, signContent, rawQuery, finalQuery, signatureStr, signatureRaw, timestamp, requestPath };
  }

  async function updateUrlPreview() {
    const appId     = document.getElementById('appId').value.trim();
    const appSecret = document.getElementById('appSecret').value.trim();
    const urlEl  = document.getElementById('urlPreview');
    const dbgEl  = document.getElementById('signDebug');

    if (!appId) {
      urlEl.textContent = '填写 AppID 后自动生成 URL…';
      dbgEl.innerHTML   = '填写 AppID + AppSecret 后自动显示签名内容…';
      return;
    }

    const result = await buildSignedUrl();
    if (!result) return;

    const { url, signContent, rawQuery, signatureRaw, signatureStr, timestamp } = result;
    currentUrl = url;

    // ── 签名调试区 ──
    if (appSecret && signContent) {
      // 用 textContent 避免 HTML 实体解析问题，再用 innerHTML 做高亮
      dbgEl.innerHTML =
        `<span style="color:#64748b">① timestamp:</span> ` +
        `<span style="color:#818cf8">${esc(timestamp)}</span><br>` +
        `<span style="color:#64748b">② sign-content (原始，不encode):</span><br>` +
        `<span style="color:#fbbf24;word-break:break-all">${esc(signContent)}</span><br>` +
        `<span style="color:#64748b">③ sign (base64):</span> ` +
        `<span style="color:#4ade80;word-break:break-all">${esc(signatureRaw)}</span><br>` +
        `<span style="color:#64748b">④ sign (URLencoded):</span> ` +
        `<span style="color:#4ade80;word-break:break-all">${esc(signatureStr)}</span>`;
    } else {
      dbgEl.innerHTML = '<span style="color:#f87171">⚠️ 未填写 AppSecret，签名未生成</span>';
    }

    // ── URL 预览（用 textContent 避免 & 被解析成 HTML 实体）──
    // Fix Bug1: 不用 innerHTML 拼接，改用 textContent
    urlEl.textContent = url;
  }

  // HTML 转义工具（防止特殊字符破坏 innerHTML）
  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  async function launchIframe() {
    const appId     = document.getElementById('appId').value.trim();
    const appSecret = document.getElementById('appSecret').value.trim();

    if (!appId)     { alert('请先填写 AppID！'); return; }
    if (!appSecret) { alert('请先填写 AppSecret（用于生成签名）！'); return; }

    const address = document.getElementById('address').value.trim();
    if (!address)   { alert('请填写收款钱包地址！'); return; }

    addLog('正在生成签名…', 'info');

    const result = await buildSignedUrl();
    if (!result) return;

    const { url, signContent, signatureRaw, signatureStr, timestamp } = result;
    currentUrl = url;

    addLog(`timestamp: ${timestamp}`, 'info');
    addLog(`sign-content: ${signContent}`, 'info');
    addLog(`sign (base64): ${signatureRaw}`, 'success');
    addLog(`sign (encoded): ${signatureStr}`, 'success');

    const frame = document.getElementById('ramp-frame');
    const placeholder = document.getElementById('placeholder');

    // ⚠️ frame.src 直接赋值完整 URL，不走 innerHTML，不会有实体解析问题
    frame.src = url;
    frame.style.display = 'block';
    placeholder.style.display = 'none';

    document.getElementById('statusDot').classList.add('active');
    document.getElementById('statusText').textContent = '加载中…';

    frame.onload = () => {
      document.getElementById('statusText').textContent =
        '✅ 已加载 · ' + (currentEnv === 'test' ? 'Sandbox' : 'Production');
      addLog('iframe 加载成功', 'success');
    };

    addLog('发起加载: ' + DOMAINS[currentEnv], 'info');
  }

  async function openNewTab() {
    if (!currentUrl) {
      const result = await buildSignedUrl();
      if (!result) { alert('请先填写 AppID！'); return; }
      currentUrl = result.url;
    }
    window.open(currentUrl, '_blank');
  }

  // 监听来自 iframe 的 postMessage 事件
  window.addEventListener('message', (event) => {
    if (!event.origin.includes('alchemypay.org')) return;
    try {
      const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
      addLog('postMessage: ' + JSON.stringify(data), data.type === 'error' ? 'error' : 'success');
    } catch {
      addLog('postMessage raw: ' + String(event.data), 'info');
    }
  });

  function addLog(msg, type = '') {
    const container = document.getElementById('logContainer');
    const entry = document.createElement('div');
    entry.className = 'log-entry ' + type;
    const time = new Date().toLocaleTimeString();
    entry.textContent = `[${time}] ${msg}`;
    container.insertBefore(entry, container.firstChild);
    while (container.children.length > 30) container.removeChild(container.lastChild);
  }
</script>

</body>
</html>
